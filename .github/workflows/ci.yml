name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Chaque lundi : détecte une régression liée à une nouvelle version de PrestaShop
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint des fichiers PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './tests/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 -d error_reporting=-1 > lint.log 2>&1 \
            || { grep -v '^No syntax errors' lint.log; exit 1; }

  js:
    name: Syntaxe JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: node --check
        run: for f in views/js/*.js; do node --check "$f"; done

  tests:
    name: Tests unitaires PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-tests-${{ matrix.php }}-${{ hashFiles('tests/composer.json') }}
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  phpstan:
    name: PHPStan PrestaShop ${{ matrix.prestashop }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: '8.2.8'
            experimental: false
          - prestashop: '9.1.5'
            experimental: false
          # Prochaine version (branche en cours) : informatif, ne bloque pas la CI
          - prestashop: '9.2.x'
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
      - uses: actions/checkout@v7
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-phpstan-${{ matrix.prestashop }}-${{ hashFiles('module/tests/composer.json') }}
      - name: Dépendances PrestaShop
        working-directory: prestashop
        run: composer install --no-dev --no-scripts --no-interaction --no-progress --ignore-platform-reqs
      - name: Dépendances de test du module
        working-directory: module/tests
        run: composer install --no-interaction --no-progress
      - name: PHPStan
        working-directory: module/tests
        env:
          _PS_ROOT_DIR_: ${{ github.workspace }}/prestashop
        run: php -d memory_limit=2G vendor/bin/phpstan analyse -c phpstan.neon --no-progress

  package:
    name: Archive du module
    runs-on: ubuntu-latest
    needs: [lint, js, tests, phpstan]
    steps:
      - uses: actions/checkout@v7
        with:
          path: everblocklight
      - name: Construire everblocklight.zip (sans outillage de dev)
        run: |
          zip -rq everblocklight.zip everblocklight \
            -x 'everblocklight/.git/*' 'everblocklight/.github/*' 'everblocklight/tests/*' \
               'everblocklight/.gitignore' 'everblocklight/**/.DS_Store'
          unzip -l everblocklight.zip | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: everblocklight
          path: everblocklight.zip
